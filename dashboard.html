<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard · TechStock</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div>
            <h1>Resumen general</h1>
            <p>Estado actual del inventario y las ventas</p>
          </div>
        </div>

        <div class="stat-cards" id="statCards"></div>

        <div class="panel">
          <div class="panel-header">
            <h3>Últimas ventas registradas</h3>
            <a href="ventas.html" class="btn btn-secondary btn-sm">Ver todas</a>
          </div>
          <table>
            <thead>
              <tr><th>Producto</th><th>Cliente</th><th>Cantidad</th><th>Total</th><th>Fecha</th></tr>
            </thead>
            <tbody id="recentSalesBody"></tbody>
          </table>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h3>Productos con stock bajo</h3>
            <a href="productos.html" class="btn btn-secondary btn-sm">Ver inventario</a>
          </div>
          <table>
            <thead>
              <tr><th>Producto</th><th>Categoría</th><th>Stock</th></tr>
            </thead>
            <tbody id="lowStockBody"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
