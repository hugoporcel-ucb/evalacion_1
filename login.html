<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión · TechStock</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo-badge">TS</div>
      <h1>TechStock</h1>
    </div>
    <p class="subtitle">Sistema de gestión de inventario y ventas</p>

    <div class="error-banner" id="loginError">Usuario o contraseña incorrectos.</div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>

    <div class="hint-box">
      Credenciales de demostración:<br />
      Usuario: <strong>admin</strong> &nbsp;·&nbsp; Contraseña: <strong>admin123</strong>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
