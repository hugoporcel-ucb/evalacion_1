<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Productos · TechStock</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div>
            <h1>Productos</h1>
            <p>Catálogo de productos disponibles en el inventario</p>
          </div>
          <a href="producto-form.html" class="btn btn-primary">+ Nuevo producto</a>
        </div>

        <div class="panel">
          <div class="toolbar">
            <input type="text" id="searchInput" class="search-input" placeholder="Buscar por nombre o categoría..." />
            <span class="text-muted" id="resultCount"></span>
          </div>

          <table>
            <thead>
              <tr>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Estado</th>
                <th class="text-right">Acciones</th>
              </tr>
            </thead>
            <tbody id="productsBody"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/productos.js"></script>
</body>
</html>
