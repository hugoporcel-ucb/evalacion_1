<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registrar producto · TechStock</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fed'/%3E%3Ctext x='32' y='42' font-size='26' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3ETS%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="breadcrumb"><a href="productos.html">Productos</a> / <span id="formModeLabel">Nuevo</span></div>
        <div class="page-head">
          <div>
            <h1 id="formTitle">Registrar producto</h1>
            <p>Complete los datos del producto para agregarlo al inventario</p>
          </div>
        </div>

        <div class="panel" style="max-width: 640px;">
          <form id="productoForm" novalidate>
            <input type="hidden" id="productoId" />

            <div class="form-grid">
              <div class="form-group full">
                <label for="nombre">Nombre del producto *</label>
                <input type="text" id="nombre" required />
                <div class="field-error">El nombre es obligatorio.</div>
              </div>

              <div class="form-group">
                <label for="categoria">Categoría *</label>
                <select id="categoria" required>
                  <option value="">Seleccione...</option>
                  <option>Computadoras</option>
                  <option>Monitores</option>
                  <option>Accesorios</option>
                  <option>Almacenamiento</option>
                  <option>Impresoras</option>
                  <option>Redes</option>
                </select>
                <div class="field-error">Seleccione una categoría.</div>
              </div>

              <div class="form-group">
                <label for="precio">Precio (Bs.) *</label>
                <input type="number" id="precio" min="0" step="0.01" required />
                <div class="field-error">Ingrese un precio válido.</div>
              </div>

              <div class="form-group">
                <label for="stock">Stock inicial *</label>
                <input type="number" id="stock" min="0" step="1" required />
                <div class="field-error">Ingrese una cantidad válida.</div>
              </div>

              <div class="form-group full">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" rows="3"></textarea>
              </div>
            </div>

            <div class="row-actions">
              <button type="submit" class="btn btn-primary">Guardar producto</button>
              <a href="productos.html" class="btn btn-secondary">Cancelar</a>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/producto-form.js"></script>
</body>
</html>
